name: Deploy to Google Play

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Release Track"
        required: true
        default: production
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine track & version name
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "track=production" >> $GITHUB_OUTPUT
            echo "versionName=${TAG_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "track=${{ github.event.inputs.track || 'internal' }}" >> $GITHUB_OUTPUT
            echo "versionName=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find Google Play version Code
        id: play_version
        uses: ankurparihar/google-play-version-check@v2.0.2
        with:
          packageName: com.jorotayo.algorubickrevamped
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Calculate Next Version Code
        id: version_calc
        run: |
          # If the action returns a value, use it. If not (first release), default to 0.
          CURRENT_VERSION=${{ steps.play_version.outputs.latestVersionCode }}
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION=0
          fi
          
          NEXT_VERSION=$((CURRENT_VERSION + 1))
          
          echo "Previous Version: $CURRENT_VERSION"
          echo "New Version: $NEXT_VERSION"
          echo "versionCode=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release AAB
        run: ./gradlew bundleRelease
        env:
          # UPDATE: Uses the calculated version code from the previous step
          VERSION_CODE: ${{ steps.version_calc.outputs.versionCode }} 
          VERSION_NAME: ${{ steps.vars.outputs.versionName }}
          KEYSTORE_FILE: Algorubick-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jorotayo.algorubickrevamped
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.vars.outputs.track }}
          status: completed
