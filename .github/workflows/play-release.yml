# Build a signed AAB and upload it to Google Play.
#
# Tracks:
#   internal  → Internal testing (auto-available to internal testers)
#   review    → Production draft (finish & submit for review in Play Console)
#
# Required GitHub Secrets:
#   KEYSTORE_BASE64            base64-encoded upload .jks
#   STORE_PASSWORD             keystore password
#   KEY_ALIAS                  key alias
#   KEY_PASSWORD               key password
#   PLAY_SERVICE_ACCOUNT_JSON  full JSON for a Play Console service account
#                              with "Release to production / testing tracks" permission
#
# Optional input overrides: version_name, version_code, release_notes
#
# Manual: Actions → Play Release → Run workflow
# Tags:   git tag v1.5.0 && git push origin v1.5.0   → review (production draft)

name: Play Release

on:
  push:
    tags:
      - "v*"
      - "internal-v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Where to publish"
        required: true
        type: choice
        default: internal
        options:
          - internal
          - review
      version_name:
        description: "versionName shown to users (e.g. 1.5.0)"
        required: true
        type: string
      version_code:
        description: "versionCode (integer). Leave blank to use the GitHub run number."
        required: false
        type: string
        default: ""
      release_notes:
        description: "Short release notes for this build (en-US)"
        required: false
        type: string
        default: "Bug fixes and improvements."
      dry_run:
        description: "Build + attach AAB only (skip Play upload)"
        required: false
        type: boolean
        default: false

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release type, version, and Play track
        id: meta
        shell: bash
        env:
          INPUT_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TYPE="${INPUT_RELEASE_TYPE}"
            VERSION_NAME="${INPUT_VERSION_NAME}"
            VERSION_CODE_INPUT="${INPUT_VERSION_CODE:-}"
            NOTES="${INPUT_RELEASE_NOTES:-Bug fixes and improvements.}"
            DRY_RUN="${INPUT_DRY_RUN:-false}"
          elif [[ "${{ github.ref_name }}" == internal-v* ]]; then
            RELEASE_TYPE="internal"
            VERSION_NAME="${GITHUB_REF_NAME#internal-v}"
            VERSION_CODE_INPUT=""
            NOTES="Internal build ${VERSION_NAME}"
            DRY_RUN="false"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            RELEASE_TYPE="review"
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE_INPUT=""
            NOTES="Release ${VERSION_NAME}"
            DRY_RUN="false"
          else
            echo "Unsupported trigger"
            exit 1
          fi

          if [[ -z "${VERSION_CODE_INPUT}" ]]; then
            VERSION_CODE="${{ github.run_number }}"
          else
            VERSION_CODE="${VERSION_CODE_INPUT}"
          fi

          if ! [[ "${VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "version_code must be an integer, got: ${VERSION_CODE}"
            exit 1
          fi

          case "${RELEASE_TYPE}" in
            internal)
              PLAY_TRACK="internal"
              PLAY_STATUS="completed"
              ARTIFACT_LABEL="internal"
              GH_PRERELEASE="true"
              ;;
            review)
              PLAY_TRACK="production"
              PLAY_STATUS="draft"
              ARTIFACT_LABEL="review"
              GH_PRERELEASE="false"
              ;;
            *)
              echo "Unknown release_type: ${RELEASE_TYPE}"
              exit 1
              ;;
          esac

          GH_TAG="play-${RELEASE_TYPE}-v${VERSION_NAME}-${VERSION_CODE}"

          {
            echo "release_type=${RELEASE_TYPE}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "play_track=${PLAY_TRACK}"
            echo "play_status=${PLAY_STATUS}"
            echo "artifact_label=${ARTIFACT_LABEL}"
            echo "gh_prerelease=${GH_PRERELEASE}"
            echo "gh_tag=${GH_TAG}"
            echo "dry_run=${DRY_RUN}"
            echo "release_notes<<NOTES_EOF"
            printf '%s\n' "${NOTES}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Release type : ${RELEASE_TYPE}"
          echo "versionName  : ${VERSION_NAME}"
          echo "versionCode  : ${VERSION_CODE}"
          echo "Play track   : ${PLAY_TRACK} (${PLAY_STATUS})"
          echo "Dry run      : ${DRY_RUN}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "Missing secret KEYSTORE_BASE64"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > app/upload-keystore.jks
          test -s app/upload-keystore.jks

      - name: Write signing.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then
              echo "Missing secret ${v}"
              exit 1
            fi
          done
          printf '%s\n' \
            "STORE_FILE=upload-keystore.jks" \
            "STORE_PASSWORD=${STORE_PASSWORD}" \
            "KEY_ALIAS=${KEY_ALIAS}" \
            "KEY_PASSWORD=${KEY_PASSWORD}" \
            > signing.properties

      - name: Build signed release bundle
        env:
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:bundleRelease --stacktrace
          ls -lh app/build/outputs/bundle/release/

      - name: Rename AAB for clarity
        id: aab
        run: |
          set -euo pipefail
          SRC=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          DEST="app/build/outputs/bundle/release/algorubick-${{ steps.meta.outputs.artifact_label }}-${{ steps.meta.outputs.version_name }}-${{ steps.meta.outputs.version_code }}.aab"
          mv "$SRC" "$DEST"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"
          echo "Built: ${DEST}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: algorubick-${{ steps.meta.outputs.artifact_label }}-${{ steps.meta.outputs.version_name }}-${{ steps.meta.outputs.version_code }}
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Write Play release notes file
        if: steps.meta.outputs.dry_run != 'true'
        env:
          NOTES: ${{ steps.meta.outputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p play-listing/en-US
          printf '%s\n' "${NOTES}" > play-listing/en-US/whatsnew

      - name: Upload to Google Play
        if: steps.meta.outputs.dry_run != 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jorotayo.algorubickrevamped
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ steps.meta.outputs.play_track }}
          status: ${{ steps.meta.outputs.play_status }}
          whatsNewDirectory: play-listing
          releaseName: ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.version_code }})

      - name: Create GitHub Release
        if: steps.meta.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || steps.meta.outputs.gh_tag }}
          name: ${{ steps.meta.outputs.release_type == 'internal' && format('Internal {0} ({1})', steps.meta.outputs.version_name, steps.meta.outputs.version_code) || format('Review {0} ({1})', steps.meta.outputs.version_name, steps.meta.outputs.version_code) }}
          body: |
            **Type:** `${{ steps.meta.outputs.release_type }}`
            **versionName:** `${{ steps.meta.outputs.version_name }}`
            **versionCode:** `${{ steps.meta.outputs.version_code }}`
            **Play track:** `${{ steps.meta.outputs.play_track }}` (`${{ steps.meta.outputs.play_status }}`)

            ${{ steps.meta.outputs.release_type == 'internal' && 'Uploaded to **Internal testing**. Testers on the internal track can install from the Play Store.' || 'Uploaded as a **Production draft**. Open Play Console → Production → finish the release and submit for review.' }}

            ### Notes
            ${{ steps.meta.outputs.release_notes }}
          files: ${{ steps.aab.outputs.path }}
          prerelease: ${{ steps.meta.outputs.gh_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Play Release"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Type | \`${{ steps.meta.outputs.release_type }}\` |"
            echo "| versionName | \`${{ steps.meta.outputs.version_name }}\` |"
            echo "| versionCode | \`${{ steps.meta.outputs.version_code }}\` |"
            echo "| Play track | \`${{ steps.meta.outputs.play_track }}\` |"
            echo "| Play status | \`${{ steps.meta.outputs.play_status }}\` |"
            echo "| Dry run | \`${{ steps.meta.outputs.dry_run }}\` |"
            echo ""
            if [[ "${{ steps.meta.outputs.release_type }}" == "internal" ]]; then
              echo "Next: open **Play Console → Testing → Internal testing** and share the testers link."
            else
              echo "Next: open **Play Console → Production**, open the draft release, complete checklist items, then **Send for review**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
