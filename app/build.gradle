plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingPropsFile = rootProject.file("signing.properties")
def signingProps = new Properties()

if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

configurations.all {
    resolutionStrategy {
        force 'androidx.annotation:annotation:1.9.1'
    }
}

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId 'com.jorotayo.algorubickrevamped'
        minSdkVersion 23
        targetSdkVersion 36

        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName "1.3.6"

        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    bundle {
        storeArchive {
            enable = false
        }
    }

    signingConfigs {
        release {
            storeFile file(signingProps['STORE_FILE'])
            storePassword signingProps['STORE_PASSWORD']
            keyAlias signingProps['KEY_ALIAS']
            keyPassword signingProps['KEY_PASSWORD']
        }
        debug {
            storeFile file(signingProps['STORE_FILE'])
            storePassword signingProps['STORE_PASSWORD']
            keyAlias signingProps['KEY_ALIAS']
            keyPassword signingProps['KEY_PASSWORD']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.jorotayo.algorubickrevamped'
    buildFeatures {
        buildConfig true
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "2.0.21" // match your Kotlin version
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.activity:activity:1.9.3'

    // Other
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.core:core-splashscreen:1.2.0-alpha02'
    implementation 'com.github.dhaval2404:imagepicker:2.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'androidx.core:core-ktx:1.17.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // ObjectBox
    debugImplementation("io.objectbox:objectbox-android-objectbrowser:4.0.3")
    releaseImplementation("io.objectbox:objectbox-android:4.0.3")
    implementation 'org.apache.commons:commons-lang3:3.9'

    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    implementation(platform("androidx.compose:compose-bom:2026.01.01"))
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.ui:ui-tooling-preview")
    debugImplementation("androidx.compose.ui:ui-tooling")

}

apply plugin: 'io.objectbox'